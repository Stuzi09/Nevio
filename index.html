<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skiwachs-Rechner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>Skiwachs-Rechner</h1>
    <p class="lead">Wetter und Schnee eingeben, du bekommst Wachs, Fluor und Struktur.</p>

    <form id="form" class="card" novalidate>
      <label class="field">
        <span>Lufttemperatur (°C)</span>
        <input id="airTemp" type="number" step="0.5" min="-40" max="15" placeholder="z. B. -4">
      </label>

      <label class="field">
        <span>Himmel</span>
        <select id="sky">
          <option value="sonnig">Sonnig</option>
          <option value="bewoelkt" selected>Bewölkt</option>
          <option value="klar">Klar / Nacht</option>
        </select>
      </label>

      <label class="field">
        <span>Niederschlag</span>
        <select id="precip">
          <option value="keiner" selected>Keiner</option>
          <option value="schnee">Schneefall</option>
          <option value="regen">Regen</option>
        </select>
      </label>

      <label class="field">
        <span>Schneetyp</span>
        <select id="snowType">
          <option value="neu">Neuschnee</option>
          <option value="alt" selected>Altschnee</option>
          <option value="kunst">Kunstschnee</option>
        </select>
      </label>

      <label class="field">
        <span>Feuchte <em>automatisch oder selbst wählen</em></span>
        <select id="moisture">
          <option value="auto" selected>Automatisch</option>
          <option value="trocken">Trocken</option>
          <option value="nass">Nass</option>
        </select>
      </label>

      <label class="field">
        <span>Schneetemperatur (°C) <em>optional, sonst wird sie geschätzt</em></span>
        <input id="snowTemp" type="number" step="0.5" min="-40" max="10" placeholder="z. B. -6">
      </label>

      <button type="submit">Wachs berechnen</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="card result" aria-live="polite" hidden>
      <div class="swatch" id="swatch"></div>
      <h2 id="resultName"></h2>
      <p id="resultDesc"></p>
      <dl>
        <dt>Produkte</dt>
        <dd id="resultVola"></dd>
        <dt>Fluor</dt>
        <dd id="resultFluor"></dd>
        <dt>Belagsstruktur</dt>
        <dd id="resultFinish"></dd>
        <dt>Mischen</dt>
        <dd id="resultCompose"></dd>
      </dl>
      <ul id="resultNotes" class="notes"></ul>
    </section>

    <p class="hint">Die Grenzen sind Richtwerte. Grundlage ist der Vola-Katalog 2025-26. Die Stufen überlappen sich, die App wählt nach nass oder trocken.</p>
  </main>
  <script src="wax.js"></script>
  <script src="app.js"></script>
</body>
</html>
